font-weight="normal">x=270, y=210, width=260, height=160.</text><text x="24" y="620" font-family="Arial" font-size="13" fill="#20352c" font-weight="normal">Top-left (270,210); bottom-right (530,370).</text><text x="24" y="646" font-family="Arial" font-size="15" fill="#20352c" font-weight="bold">2 Circle</text><text x="24" y="664" font-family="Arial" font-size="13" fill="#20352c" font-weight="normal">cx=670, cy=85, r=42.</text><text x="24" y="681" font-family="Arial" font-size="13" fill="#20352c" font-weight="normal">Centre (670,85); radius 42.</text><text x="24" y="707" font-family="Arial" font-size="15" fill="#20352c" font-weight="bold">3 Ellipse</text><text x="24" y="725" font-family="Arial" font-size="13" fill="#20352c" font-weight="normal">cx=131, cy=240, rx=58, ry=70.</text><text x="24" y="742" font-family="Arial" font-size="13" fill="#20352c" font-weight="normal">Centre (131,240); horizontal radius 58; vertical radius 70.</text><text x="24" y="768" font-family="Arial" font-size="15" fill="#20352c" font-weight="bold">4 Line</text><text x="24" y="786" font-family="Arial" font-size="13" fill="#20352c" font-weight="normal">x1=610, y1=340, x2=750, y2=340.</text><text x="24" y="803" font-family="Arial" font-size="13" fill="#20352c" font-weight="normal">Start (610,340); end (750,340).</text><text x="24" y="829" font-family="Arial" font-size="15" fill="#20352c" font-weight="bold">5 Polygon</text><text x="24" y="847" font-family="Arial" font-size="13" fill="#20352c" font-weight="normal">points=&quot;245,210 400,100 555,210&quot;</text><text x="24" y="864" font-family="Arial" font-size="13" fill="#20352c" font-weight="normal">Three vertices; the last edge closes to the first.</text><text x="24" y="890" font-family="Arial" font-size="15" fill="#20352c" font-weight="bold">6 Polyline</text><text x="24" y="908" font-family="Arial" font-size="13" fill="#20352c" font-weight="normal">points=&quot;40,345 65,325 90,345 115,325 140,345&quot;</text><text x="24" y="925" font-family="Arial" font-size="13" fill="#20352c" font-weight="normal">Five connected points; the ends stay open.</text><text x="24" y="951" font-family="Arial" font-size="15" fill="#20352c" font-weight="bold">7 Path</text><text x="24" y="969" font-family="Arial" font-size="13" fill="#20352c" font-weight="normal">M385,350 Q320,420 430,500 L560,500 Q410,420 425,350 Z</text><text x="24" y="986" font-family="Arial" font-size="13" fill="#20352c" font-weight="normal">M starts; Q curves via a control point; L draws a line; Z closes.</text><text x="24" y="1012" font-family="Arial" font-size="15" fill="#20352c" font-weight="bold">8 Text</text><text x="24" y="1030" font-family="Arial" font-size="13" fill="#20352c" font-weight="normal">x=600, y=420; font-size=24.</text><text x="24" y="1047" font-family="Arial" font-size="13" fill="#20352c" font-weight="normal">(600,420) marks the start of the text baseline.</text></svg>